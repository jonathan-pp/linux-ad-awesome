<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <filter id="ombre" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1280" height="700" fill="#ffffff"/>
  <text x="640" y="52" text-anchor="middle" font-size="28" font-weight="800" fill="#0f172a">Le cycle de vie d’un poste, de l’installation à la maintenance</text>
  <text x="640" y="84" text-anchor="middle" font-size="17" fill="#64748b">Chaque brique remplace un outil Microsoft payant, et sait gérer à la fois Windows et Linux</text>

  <!-- 1 -->
  <g filter="url(#ombre)">
    <rect x="40" y="120" width="280" height="330" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  </g>
  <circle cx="84" cy="164" r="22" fill="#22c55e"/><text x="84" y="172" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">1</text>
  <text x="118" y="160" font-size="22" font-weight="800" fill="#14532d">Installer</text>
  <text x="118" y="183" font-size="15" fill="#166534">PXE Deploy</text>
  <g font-size="15" fill="#334155">
    <text x="64" y="226">• démarrage réseau (F12)</text>
    <text x="64" y="254">• Windows 10 / 11 sans intervention</text>
    <text x="64" y="282">• Ubuntu, Debian, Arch</text>
    <text x="64" y="310">• profils façon MDT : comptes,</text>
    <text x="80" y="332">domaine, applications, pilotes</text>
    <text x="64" y="360">• pilotes Dell, HP, Lenovo</text>
  </g>
  <rect x="54" y="388" width="252" height="34" rx="17" fill="#dcfce7"/>
  <text x="180" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">remplace WDS + MDT · fonctionnel</text>

  <!-- 2 -->
  <g filter="url(#ombre)">
    <rect x="350" y="120" width="280" height="330" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  </g>
  <circle cx="394" cy="164" r="22" fill="#2563eb"/><text x="394" y="172" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">2</text>
  <text x="428" y="160" font-size="22" font-weight="800" fill="#1e3a8a">Identités et règles</text>
  <text x="428" y="183" font-size="15" fill="#1d4ed8">Console Annuaire</text>
  <g font-size="15" fill="#334155">
    <text x="374" y="226">• domaine Active Directory (Samba)</text>
    <text x="374" y="254">• utilisateurs, groupes, GPO</text>
    <text x="374" y="282">• DNS, DHCP, partages, droits</text>
    <text x="374" y="310">• antivirus, disques, journaux</text>
    <text x="374" y="338">• interface identique aux outils</text>
    <text x="390" y="360">d’administration de Windows</text>
  </g>
  <rect x="364" y="388" width="252" height="34" rx="17" fill="#dbeafe"/>
  <text x="490" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">remplace Windows Server · fonctionnel</text>

  <!-- 3 -->
  <g filter="url(#ombre)">
    <rect x="660" y="120" width="280" height="330" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <circle cx="704" cy="164" r="22" fill="#f59e0b"/><text x="704" y="172" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">3</text>
  <text x="738" y="160" font-size="22" font-weight="800" fill="#78350f">Appliquer</text>
  <text x="738" y="183" font-size="15" fill="#b45309">linux-gpo</text>
  <g font-size="15" fill="#334155">
    <text x="684" y="226">• les GPO enfin appliquées</text>
    <text x="700" y="248">sur les postes Linux</text>
    <text x="684" y="276">• sudo, SSH, pare-feu, USB,</text>
    <text x="700" y="298">verrouillage, navigateurs…</text>
    <text x="684" y="326">• toutes distributions et bureaux</text>
    <text x="684" y="354">• Windows : nativement</text>
  </g>
  <rect x="674" y="388" width="252" height="34" rx="17" fill="#fef3c7"/>
  <text x="800" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">client GPO pour Linux · en cours</text>

  <!-- 4 -->
  <g filter="url(#ombre)">
    <rect x="970" y="120" width="280" height="330" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 7"/>
  </g>
  <circle cx="1014" cy="164" r="22" fill="#94a3b8"/><text x="1014" y="172" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">4</text>
  <text x="1048" y="160" font-size="22" font-weight="800" fill="#334155">Maintenir</text>
  <text x="1048" y="183" font-size="15" fill="#64748b">à venir</text>
  <g font-size="15" fill="#475569">
    <text x="994" y="226">• prise en main à distance</text>
    <text x="994" y="254">• actions à distance sur un poste</text>
    <text x="994" y="282">• inventaire matériel et logiciel</text>
    <text x="994" y="310">• déploiement de logiciels</text>
    <text x="994" y="338">• mises à jour suivies</text>
  </g>
  <rect x="984" y="388" width="252" height="34" rx="17" fill="#e2e8f0"/>
  <text x="1110" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">remplacera PDQ Deploy / Inventory</text>

  <!-- flèches entre les étapes -->
  <line x1="322" y1="285" x2="346" y2="285" stroke="#64748b" stroke-width="3" marker-end="url(#f)"/>
  <line x1="632" y1="285" x2="656" y2="285" stroke="#64748b" stroke-width="3" marker-end="url(#f)"/>
  <line x1="942" y1="285" x2="966" y2="285" stroke="#64748b" stroke-width="3" marker-end="url(#f)"/>

  <!-- les postes -->
  <path d="M180 452 V505 H1110 V452" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="645" y1="505" x2="645" y2="540" stroke="#64748b" stroke-width="3" marker-end="url(#f)"/>
  <g filter="url(#ombre)">
    <rect x="300" y="545" width="320" height="120" rx="16" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
    <rect x="670" y="545" width="320" height="120" rx="16" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  </g>
  <g transform="translate(330 578)">
    <rect width="24" height="24" rx="3" fill="#38bdf8"/><rect x="27" width="24" height="24" rx="3" fill="#38bdf8"/>
    <rect y="27" width="24" height="24" rx="3" fill="#38bdf8"/><rect x="27" y="27" width="24" height="24" rx="3" fill="#38bdf8"/>
  </g>
  <text x="400" y="596" font-size="21" font-weight="800" fill="#0f172a">Postes Windows</text>
  <text x="400" y="622" font-size="15" fill="#475569">rejoignent le domaine comme</text>
  <text x="400" y="642" font-size="15" fill="#475569">avec un vrai Windows Server</text>
  <g transform="translate(700 578)">
    <rect width="51" height="51" rx="8" fill="#0f172a"/>
    <text x="8" y="34" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="22" font-weight="700" fill="#4ade80">&gt;_</text>
  </g>
  <text x="770" y="596" font-size="21" font-weight="800" fill="#0f172a">Postes Linux</text>
  <text x="770" y="622" font-size="15" fill="#475569">mêmes comptes, mêmes règles,</text>
  <text x="770" y="642" font-size="15" fill="#475569">même console que Windows</text>
</svg>
