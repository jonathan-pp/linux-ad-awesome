<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#13244a"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.82" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grille" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="22" fill="url(#fond)"/>
  <rect width="1280" height="420" rx="22" fill="url(#grille)"/>
  <rect width="1280" height="420" rx="22" fill="url(#halo)"/>

  <!-- Windows + Linux réunis -->
  <g transform="translate(905 92)">
    <circle cx="140" cy="118" r="128" fill="#ffffff" fill-opacity="0.06" stroke="#93c5fd" stroke-opacity="0.35" stroke-width="2"/>
    <g transform="translate(36 70)">
      <rect width="40" height="40" rx="4" fill="#38bdf8"/><rect x="44" width="40" height="40" rx="4" fill="#38bdf8" fill-opacity="0.85"/>
      <rect y="44" width="40" height="40" rx="4" fill="#38bdf8" fill-opacity="0.85"/><rect x="44" y="44" width="40" height="40" rx="4" fill="#38bdf8" fill-opacity="0.7"/>
    </g>
    <text x="140" y="128" text-anchor="middle" font-size="40" font-weight="700" fill="#e2e8f0">+</text>
    <g transform="translate(164 70)">
      <rect width="84" height="84" rx="12" fill="#0f172a" stroke="#4ade80" stroke-width="3"/>
      <text x="14" y="54" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="34" font-weight="700" fill="#4ade80">&gt;_</text>
    </g>
    <text x="140" y="212" text-anchor="middle" font-size="15" fill="#bfdbfe">un seul domaine, deux mondes</text>
  </g>

  <text x="70" y="128" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1">linux-ad-awesome</text>
  <text x="72" y="178" font-size="25" fill="#cbd5e1">Gérer tout un parc informatique sans licence Microsoft :</text>
  <text x="72" y="212" font-size="25" fill="#cbd5e1">des postes Linux et des postes Windows, comme avant.</text>

  <g font-size="16" font-weight="600">
    <rect x="70" y="262" width="196" height="44" rx="22" fill="#22c55e" fill-opacity="0.16" stroke="#22c55e"/>
    <text x="168" y="290" text-anchor="middle" fill="#bbf7d0">① Déploiement PXE</text>
    <rect x="280" y="262" width="214" height="44" rx="22" fill="#22c55e" fill-opacity="0.16" stroke="#22c55e"/>
    <text x="387" y="290" text-anchor="middle" fill="#bbf7d0">② Annuaire et GPO</text>
    <rect x="508" y="262" width="214" height="44" rx="22" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b"/>
    <text x="615" y="290" text-anchor="middle" fill="#fde68a">③ GPO pour Linux</text>
    <rect x="70" y="320" width="300" height="44" rx="22" fill="#94a3b8" fill-opacity="0.12" stroke="#94a3b8" stroke-dasharray="6 5"/>
    <text x="220" y="348" text-anchor="middle" fill="#e2e8f0">④ Contrôle à distance et inventaire</text>
    <text x="388" y="348" font-size="15" font-weight="400" fill="#94a3b8">fonctionnel · en cours · à venir</text>
  </g>
</svg>
