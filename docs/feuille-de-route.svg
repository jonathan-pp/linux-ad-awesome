<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="330" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#0f172a">Feuille de route</text>
  <!-- axe -->
  <line x1="80" y1="150" x2="1150" y2="150" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round"/>
  <line x1="80" y1="150" x2="760" y2="150" stroke="#22c55e" stroke-width="10" stroke-linecap="round"/>
  <line x1="760" y1="150" x2="900" y2="150" stroke="#f59e0b" stroke-width="10"/>
  <!-- jalons -->
  <g font-size="15">
    <circle cx="120" cy="150" r="18" fill="#22c55e" stroke="#fff" stroke-width="4"/>
    <text x="120" y="156" text-anchor="middle" fill="#fff" font-weight="800">✓</text>
    <text x="120" y="102" text-anchor="middle" font-weight="800" fill="#14532d">Déploiement PXE</text>
    <text x="120" y="200" text-anchor="middle" fill="#475569">Windows et Linux</text>
    <text x="120" y="220" text-anchor="middle" fill="#475569">sans intervention</text>

    <circle cx="350" cy="150" r="18" fill="#22c55e" stroke="#fff" stroke-width="4"/>
    <text x="350" y="156" text-anchor="middle" fill="#fff" font-weight="800">✓</text>
    <text x="350" y="102" text-anchor="middle" font-weight="800" fill="#14532d">Contrôleur de domaine</text>
    <text x="350" y="200" text-anchor="middle" fill="#475569">Samba AD, DNS, DHCP,</text>
    <text x="350" y="220" text-anchor="middle" fill="#475569">fichiers, antivirus</text>

    <circle cx="580" cy="150" r="18" fill="#22c55e" stroke="#fff" stroke-width="4"/>
    <text x="580" y="156" text-anchor="middle" fill="#fff" font-weight="800">✓</text>
    <text x="580" y="102" text-anchor="middle" font-weight="800" fill="#14532d">Console familière</text>
    <text x="580" y="200" text-anchor="middle" fill="#475569">les écrans de Windows,</text>
    <text x="580" y="220" text-anchor="middle" fill="#475569">dans un navigateur</text>

    <circle cx="810" cy="150" r="20" fill="#f59e0b" stroke="#fff" stroke-width="4"/>
    <circle cx="810" cy="150" r="30" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="4"/>
    <text x="810" y="102" text-anchor="middle" font-weight="800" fill="#92400e">GPO pour Linux</text>
    <text x="810" y="200" text-anchor="middle" fill="#475569">agent linux-gpo :</text>
    <text x="810" y="220" text-anchor="middle" fill="#475569">testé, à éprouver sur le terrain</text>

    <circle cx="1040" cy="150" r="18" fill="#ffffff" stroke="#94a3b8" stroke-width="4" stroke-dasharray="5 4"/>
    <text x="1040" y="102" text-anchor="middle" font-weight="800" fill="#334155">Maintenance à distance</text>
    <text x="1040" y="200" text-anchor="middle" fill="#475569">contrôle, actions, inventaire,</text>
    <text x="1040" y="220" text-anchor="middle" fill="#475569">déploiement de logiciels</text>

  </g>
  <g font-size="14" fill="#475569">
    <circle cx="90" cy="285" r="8" fill="#22c55e"/><text x="106" y="290">fonctionnel</text>
    <circle cx="220" cy="285" r="8" fill="#f59e0b"/><text x="236" y="290">en cours</text>
    <circle cx="330" cy="285" r="8" fill="#ffffff" stroke="#94a3b8" stroke-width="3" stroke-dasharray="3 3"/><text x="346" y="290">à venir</text>
    <text x="1200" y="290" text-anchor="end" font-weight="700" fill="#1d4ed8">Objectif : remplacer Windows, sans abandonner les postes Windows</text>
  </g>
</svg>
